services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus360
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - nexus360_pgdata:/var/lib/postgresql/data
      # Los scripts en db/ se ejecutan una sola vez, en orden alfabético,
      # la PRIMERA vez que se crea el volumen (001_schema.sql, luego
      # 002_role_password.sql). Si ya existía el volumen, bórralo con
      # `docker compose down -v` para que vuelvan a correr.
      - ./db:/docker-entrypoint-initdb.d

  # Servidor de correo FALSO para desarrollo: atrapa todo lo que el backend
  # envía por SMTP (puerto 1025) y lo muestra en http://localhost:8025.
  # Nada sale a internet. Ver «Recuperación de contraseña (013)» en el README.
  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # bandeja web + API
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  nexus360_pgdata:
